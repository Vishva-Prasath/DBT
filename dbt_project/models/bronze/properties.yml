version: 2

models:
    - name: bronze_dim_store # Must match the name of the model file (without .sql) and including the case-sensitivity .
      config: 
        materialized: view

    - name: bronze_dim_product
      config: 
        materialized: view
    
    - name: bronze_sales
      columns:
        - name: sales_id
          data_tests:
            - unique
            - not_null
        - name: gross_amount
          data_tests:
              - generic_non_negative 
        - name: payment_method
          data_tests:
            - accepted_values:
                arguments:
                  values: ['Cash', 'Digital Wallet','Card','Gift Card']
                config:
                  severity: warn