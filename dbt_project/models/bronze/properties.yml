version: 2

models:
    - name: bronze_dim_store
      config: 
        materialized: view

    - name: bronze_dim_product
      config: 
        materialized: view
    
    - name: bronze_sales
      columns:
        - name: sales_id
          data_tests:
            - unique
            - not_null
        - name: gross_amount
          data_tests:
              - generic_non_negative 
    - name: bronze_dim_store
      columns:
        - name: country
          data_tests:
            - accepted_values:
                arguments:
                  values: ['USA', 'Canada']
                config:
                  severity: warn